syntax = "proto3";
import "google/protobuf/empty.proto";
package jigen;
option csharp_namespace = "Jigen.Proto";

service StoreCollectionService {
  rpc ListCollections (CollectionKey) returns (ListCollectionResult);
  rpc GetContent (ItemKey) returns (RawContentResult);
  // Stored full-precision embedding of a key. Empty Embeddings when the key
  // does not exist or the entry was stored without a vector.
  rpc GetEmbedding (ItemKey) returns (EmbeddingResponse);
  rpc SetDocument (Document) returns (Result);
  rpc SetVector (Vector) returns (Result);
  // Bulk ingestion: one call, many entries. Avoids the per-item round trip of
  // SetVector/SetDocument; SetDocuments also batches the server-side embedding
  // calculation of the streamed sentences.
  rpc SetVectors (stream Vector) returns (IngestResult);
  rpc SetDocuments (stream Document) returns (IngestResult);
  rpc SearchVector(SearchVectorRequest) returns(SearchVectorResponse);
  rpc SearchDocument(SearchDocumentRequest) returns(SearchVectorResponse);
  rpc DeleteVector(ItemKey) returns(Result);
  rpc GetAllKeys(CollectionKey) returns(KeysResult);
  // Keys in chunks over a server stream: use instead of GetAllKeys on large
  // collections, where a single KeysResult would exceed the message size cap.
  rpc StreamKeys(StreamKeysRequest) returns(stream KeysResult);
  rpc Contains(ItemKey) returns(Result);
  rpc Clear(CollectionKey) returns(Result);
  rpc Count(CollectionKey) returns(CountResult);

  rpc CalculateEmbeddings (EmbeddingRequest) returns (EmbeddingResponse);
  rpc CalculateEmbeddingsBatch (EmbeddingBatchRequest) returns (EmbeddingBatchResponse);

  // ── Direct image embedding: raw image bytes in, vision model vector out ──
  rpc CalculateImageEmbedding (ImageEmbeddingRequest) returns (EmbeddingResponse);
  rpc CalculateImageEmbeddingBatch (ImageEmbeddingBatchRequest) returns (EmbeddingBatchResponse);
  rpc CalculateImageTileEmbeddings (ImageEmbeddingRequest) returns (ImageTileEmbeddingsResponse);

  // ── Collection metadata ──
  rpc GetCollectionInfo(CollectionKey) returns (CollectionInfoResponse);
  // Full details of all collections in a database (the Collection field of
  // the request is ignored; only Database is used).
  rpc GetCollectionsInfo(CollectionKey) returns (CollectionsInfoResponse);
  rpc GetCollectionGraph(GetGraphRequest) returns (GraphSnapshotResponse);

  // ── Filter-only search (no query vector, no similarity scores) ──
  rpc SearchFilter(SearchFilterRequest) returns (SearchVectorResponse);

  // ── Append-only variants: reject when the key already exists, unlike
  //     SetDocument/SetVector which upsert. ──
  rpc AppendDocument(Document) returns (Result);
  rpc AppendVector(Vector) returns (Result);

  // ── Raw vector storage without server-side normalization or processing. ──
  rpc SetRawVector(Vector) returns (Result);

  // ── Multi-entry atomic transaction with WAL durability guarantees.
  //     Bidirectional stream: client sends Begin → Append*/Delete → Commit/Rollback;
  //     server acknowledges each step and commits atomically on Commit. ──
  rpc Transaction(stream TransactionOp) returns (stream TransactionResult);
}

message ItemKey{
  string Database = 1;
  string Collection = 2;
  bytes Key = 3;
}

message CollectionKey{
  string Database = 1;
  string Collection = 2;
}

message KeysResult{
  repeated bytes Keys = 1;
}

message StreamKeysRequest{
  string Database = 1;
  string Collection = 2;
  // Keys per streamed message; 0 = server default (1000).
  int32 ChunkSize = 3;
}

message CountResult{
  int32 Count = 1;
}

message Document {
  string Database = 1;
  string Collection = 2;
  bytes Key = 3;
  bytes Content = 4;
  string Sentence = 5;
}

message Vector {
  string Database = 1;
  string Collection = 2;
  bytes Key = 3;
  bytes Content = 4;
  repeated float Embeddings = 5;
}

// Per-query search tuning, shared by SearchVectorRequest and
// SearchDocumentRequest. Every field is optional: the zero value keeps the
// server's configured behavior.
// - EfSearch: HNSW beam width override for this query (recall vs latency);
//   0 = server default. Ignored by exact (brute force) indexes.
// - NoContent: return keys and scores only, skipping the content bytes.
// - MinScore: drop results scoring below this similarity.
message SearchTuning {
  int32 EfSearch = 1;
  bool NoContent = 2;
  optional float MinScore = 3;
}

message SearchVectorRequest {
  string Database = 1;
  string Collection = 2;
  repeated float Embeddings = 3;
  int32 Top = 4;
  FilterNode Filter = 5;
  SearchTuning Tuning = 6;
}

message SearchVectorResult {
  bytes Key = 1;
  bytes Content = 2;
  float Score = 3;
}

message SearchVectorResponse {
  repeated SearchVectorResult Results = 1;
}

message SearchDocumentRequest {
  string Database = 1;
  string Collection = 2;
  string Sentence = 3;
  int32 Top = 4;
  FilterNode Filter = 5;
  SearchTuning Tuning = 6;
}

message FilterNode {
  oneof Kind {
    PropertyEqualsCondition Equals = 1;
    PropertyCollectionAnyCondition CollectionAny = 2;
    LogicalCondition And = 3;
    LogicalCondition Or = 4;
  }
}

message PropertyEqualsCondition {
  string PropertyPath = 1;
  FilterValue Value = 2;
}

message PropertyCollectionAnyCondition {
  string PropertyPath = 1;
  FilterValue Value = 2;
}

message LogicalCondition {
  FilterNode Left = 1;
  FilterNode Right = 2;
}

message FilterValue {
  oneof Kind {
    string StringValue = 1;
    int32 IntValue = 2;
    int64 LongValue = 3;
    double DoubleValue = 4;
    bool BoolValue = 5;
    bool NullValue = 6;
  }
}

message Result {
  bool Success = 1;
  string Message = 2;
}

message IngestResult {
  bool Success = 1;
  string Message = 2;
  // Entries accepted into the ingestion pipeline. Durability follows the
  // server's group-commit policy, like the unary Set operations.
  int32 Accepted = 3;
}

message EmbeddingRequest {
  string Message = 1;
  string Task = 2;
}

message EmbeddingResponse {
  repeated float Embeddings = 1;
}

message EmbeddingBatchRequest {
  repeated string Messages = 1;
  string Task = 2;
}

message EmbeddingBatchResponse {
  // One entry per input message, same order. An input the model could not
  // embed yields an entry with an empty Embeddings list.
  repeated EmbeddingResponse Results = 1;
}

// Direct image embedding: raw image bytes in, the vision model's vector out,
// aligned to the text embedding space so image and text vectors are comparable.
message ImageEmbeddingRequest {
  bytes Image = 1;
}

message ImageEmbeddingBatchRequest {
  repeated bytes Images = 1;
}

// One EmbeddingResponse per tile (raster order) plus the whole-image embedding
// appended as the last entry.
message ImageTileEmbeddingsResponse {
  repeated EmbeddingResponse Tiles = 1;
}

message ListCollectionResult{
  repeated string collections = 1;
}

message RawContentResult{
  bytes content = 1;
}

message JsonContentResult{
  string content = 1;
}

// ─────────────────────────────────────────────────────────────────
//  Collection metadata messages (GetCollectionInfo / GetCollectionsInfo)
// ─────────────────────────────────────────────────────────────────

message CollectionInfoResponse {
  string Name = 1;
  int32 Vectors = 2;
  int32 Dimensions = 3;
  int64 ContentSize = 4;
  int64 VectorSize = 5;
  // Vector-index metrics; absent when the indexer does not expose them.
  CollectionIndexInfoResponse Index = 6;
}

message CollectionIndexInfoResponse {
  int64 IndexSizeBytes = 1;
  int32 Nodes = 2;            // live (non-deleted) graph nodes
  int32 DeletedNodes = 3;      // soft-deleted nodes still in the graph
  int32 MaxLevel = 4;          // highest HNSW layer
  repeated int32 NodesPerLevel = 5;  // NodesPerLevel[L] = live nodes whose top layer is L
  double AverageDegree = 6;    // average layer-0 degree of live nodes
  string Quantization = 7;     // "None" or "SQ8"
}

message CollectionsInfoResponse {
  repeated CollectionInfoResponse Collections = 1;
}

// ─────────────────────────────────────────────────────────────────
//  Graph visualization messages (GetCollectionGraph)
// ─────────────────────────────────────────────────────────────────

message GetGraphRequest {
  string Database = 1;
  string Collection = 2;
  int32 Dimensions = 3;       // 2 or 3, default 2
  int32 Limit = 4;            // max nodes returned, default 2000
  optional int32 Level = 5;   // filter to a single HNSW layer; omit for all
}

message GraphSnapshotResponse {
  string Collection = 1;
  int32 Dimensions = 2;
  int32 TotalNodes = 3;
  int32 LiveNodes = 4;
  int32 DeletedNodes = 5;
  int32 ReturnedNodes = 6;
  int32 MaxLevel = 7;
  int32 EntrypointPositionId = 8;
  bool Truncated = 9;         // true when Limit cut the sample
  repeated GraphNodeResponse Nodes = 10;
  repeated GraphEdgeResponse Edges = 11;
}

message GraphNodeResponse {
  int32 PositionId = 1;
  string Key = 2;             // base64 of the raw vector key bytes
  int32 MaxLevel = 3;
  bool IsDeleted = 4;
  int32 Degree = 5;           // neighbor count at the requested layer (or layer 0)
  repeated float Position = 6; // PCA coordinates, normalized to [-1, 1]
}

message GraphEdgeResponse {
  int32 Source = 1;           // PositionId
  int32 Target = 2;           // PositionId
  int32 Level = 3;            // HNSW layer this edge belongs to
}

// ─────────────────────────────────────────────────────────────────
//  Filter-only search (SearchFilter)
// ─────────────────────────────────────────────────────────────────

message SearchFilterRequest {
  string Database = 1;
  string Collection = 2;
  FilterNode Filter = 3;
}

// ─────────────────────────────────────────────────────────────────
//  Transaction messages (Transaction — bidirectional stream)
// ─────────────────────────────────────────────────────────────────

message TransactionOp {
  oneof Op {
    BeginTransaction Begin = 1;
    Document AppendDoc = 2;    // reuses existing Document message
    Vector AppendVec = 3;      // reuses existing Vector message
    ItemKey Delete = 4;        // reuses existing ItemKey message
    CommitOp Commit = 5;
    RollbackOp Rollback = 6;
  }
}

message BeginTransaction {
  string Database = 1;        // database the transaction operates on
}

message CommitOp {}
message RollbackOp {}

message TransactionResult {
  oneof Result {
    TransactionStarted Started = 1;
    TransactionAccepted Accepted = 2;
    TransactionCommitted Committed = 3;
    TransactionRolledBack RolledBack = 4;
    TransactionError Error = 5;
  }
}

message TransactionStarted {
  string TxId = 1;            // Guid of the transaction
}

message TransactionAccepted {
  int32 CumulativeCount = 1;  // number of ops accepted so far in this transaction
}

message TransactionCommitted {}
message TransactionRolledBack {}

message TransactionError {
  string Message = 1;
}